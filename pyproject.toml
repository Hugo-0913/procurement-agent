[project]
name = "procurement-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "deepagents",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langchain-deepseek",
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "jinja2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "eval_results", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 行长由格式化工具管，不参与 lint（中文字符宽度让 E501 误报偏多）
ignore = ["E501"]
