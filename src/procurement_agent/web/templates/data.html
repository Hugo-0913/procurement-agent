{% extends "base.html" %}
{% block title %}数据台 · 医用耗材采购自动化 Agent{% endblock %}
{% block content %}
<div class="grid2">
  <section class="panel">
    <div class="row">
      <button class="chip active" id="tab-suppliers">供应商能不能用</button>
      <button class="chip" id="tab-quotes">谁家报价划算</button>
      <button class="chip" id="tab-orders">买到的东西</button>
    </div>
    <div id="data-table"></div>
  </section>

  <section class="panel" id="fault-panel">
    <h3>模拟异常情况</h3>
    <p class="hint">打开任意开关后，回首页重新提交一次采购，就能看到系统怎么处理这些坏情况。开关是临时的，随时可以关掉。</p>
    <div id="fault-list">
      {% for flag in fault_flags %}
      <label class="switch">
        <input type="checkbox" data-flag="{{ flag.flag }}" {% if flag.enabled %}checked{% endif %}>
        <span>{{ flag.label }}</span>
      </label>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/data.js"></script>
{% endblock %}
