{% extends "base.html" %}
{% block title %}任务看板 · 耗材采购自动化 Agent{% endblock %}
{% block content %}
{% if offline_mode %}
<div class="banner">离线演示模式：未配置 DEEPSEEK_API_KEY，需求解析使用内置规则解析器，全流程不联网。</div>
{% endif %}
<section class="panel hero">
  <div class="hero-text">
    <h1>新建采购需求</h1>
    <p class="hint">用一句话描述你要采购的东西，系统会完成资质核验、比价、下单，遇到敏感情况停下来让你审批。</p>
  </div>
  <textarea id="request-text" rows="2" placeholder="例如：采购 50 箱 A4 纸，下周一前到货，成本中心 CC-1001"></textarea>
  <div class="row">
    <button id="btn-submit" class="primary">提交需求</button>
    <button id="btn-sample" class="ghost">填入示例需求</button>
    <span id="submit-hint" class="hint"></span>
  </div>
</section>

<section class="panel">
  <div class="panel-head">
    <h2>历史任务</h2>
    <div class="row" id="status-filters">
      <button class="chip active" data-state="">全部</button>
      <button class="chip" data-state="RUNNING">运行中</button>
      <button class="chip" data-state="AWAITING_APPROVAL">等待审批</button>
      <button class="chip" data-state="COMPLETED">已完成</button>
      <button class="chip" data-state="FAILED">失败</button>
    </div>
  </div>
  <div id="task-list" class="cards"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/board.js"></script>
{% endblock %}
